# general
set-option -g prefix C-a

set -g default-terminal "xterm-256color"

set -g base-index 1
setw -g pane-base-index 1

set-option -g status-position top

set -g mouse on

# panes
# create new pane
bind c new-window -c "#{pane_current_path}"
# split horizontally
bind '"' split-window -c "#{pane_current_path}"
bind s split-window -c "#{pane_current_path}"
# split vertically
bind % split-window -h -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

set-option -g status-interval 0
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# sessions
bind M-j switch-client -n
bind M-l switch-client -p

# plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-sensible'

# TODO
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'Morantron/tmux-fingers'
# set -g @plugin 'tmux-plugins/tmux-copycat'
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# theme
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_pane_border_style "fg=#{thm_gray}"
set -g @catppuccin_pane_active_border_style "fg=#{thm_orange}"

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " | "
set -g @catppuccin_window_number_position "left"

set -g @catppuccin_window_default_fill "none"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_text " #W"

set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_status_modules_right "application cpu host date_time session"
set -g @catppuccin_directory_text "#{pane_current_path}"

# tmux fzf
TMUX_FZF_LAUNCH_KEY="C-r"
bind-key "C-c" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh new"
bind-key "C-k" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh kill"
bind-key "C-l" run-shell -b "~/.tmux/plugins/tmux-fzf/scripts/session.sh switch"

run '~/.tmux/plugins/tpm/tpm'

